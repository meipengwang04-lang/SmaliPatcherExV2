name: Build SmaliPatcherEx Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PUBLISH_DIR: publish

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish project
        run: |
          dotnet publish SmaliPatcherEx.csproj -c Release -o ${{ env.PUBLISH_DIR }}

      - name: Copy patches to publish output
        run: xcopy patches ${{ env.PUBLISH_DIR }}\patches\ /E /H /Y

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmaliPatcherEx-Windows-x64
          path: ${{ env.PUBLISH_DIR }}
